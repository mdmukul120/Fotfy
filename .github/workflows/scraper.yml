name: FootfyTV Advanced Live Scraper

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install playwright beautifulsoup4

    - name: Install Playwright Browsers & System Dependencies
      run: |
        npx playwright install --with-deps chromium

    - name: Run Advanced Scraper
      run: python scraper.py

    - name: Commit and Push Updated matches.json
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add matches.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update matches.json [skip ci]" && git push)
